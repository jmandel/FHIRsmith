<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ValueSet $expand Explorer</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1e1e2e;--bg2:#282840;--bg3:#313150;--bg4:#3a3a5c;
  --fg:#cdd6f4;--fg2:#a6adc8;--fg3:#7f849c;
  --blue:#89b4fa;--green:#a6e3a1;--red:#f38ba8;--purple:#cba6f7;
  --orange:#fab387;--yellow:#f9e2af;--teal:#94e2d5;--pink:#f5c2e7;
  --surface:#45475a;--overlay:#585b70;
  --radius:6px;--mono:'Menlo','Consolas','DejaVu Sans Mono','Liberation Mono',monospace;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--fg);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;border-radius:var(--radius)}
input,textarea,select{font-family:inherit;background:var(--bg);color:var(--fg);
  border:1px solid var(--surface);border-radius:var(--radius);padding:6px 8px;font-size:13px}
input:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{font-family:var(--mono);font-size:12px;resize:vertical;tab-size:2}

/* Layout: 2 columns */
.app{display:grid;grid-template-columns:260px 1fr;height:100vh;overflow:hidden}
@media(max-width:800px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}}

/* Sidebar */
.sidebar{background:var(--bg2);border-right:1px solid var(--surface);overflow-y:auto;padding:8px 0}
.sidebar h2{font-size:13px;padding:8px 12px;color:var(--fg3);text-transform:uppercase;letter-spacing:.5px}
.cat-header{display:flex;align-items:center;gap:6px;padding:6px 12px;cursor:pointer;
  color:var(--fg2);font-weight:600;font-size:13px;user-select:none}
.cat-header:hover{background:var(--bg3)}
.cat-header .arrow{font-size:10px;transition:transform .15s}
.cat-header.collapsed .arrow{transform:rotate(-90deg)}
.cat-items{overflow:hidden}
.cat-items.hidden{display:none}
.test-item{padding:5px 12px 5px 28px;cursor:pointer;font-size:12px;color:var(--fg2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.test-item:hover{background:var(--bg3);color:var(--fg)}
.test-item.active{background:var(--bg4);color:var(--blue);font-weight:600}

/* Main content */
.main{display:flex;flex-direction:column;overflow:hidden;position:relative}
.progress-bar{position:absolute;top:0;left:0;right:0;height:3px;background:transparent;z-index:10}
.progress-bar.loading{background:linear-gradient(90deg,transparent,var(--blue),transparent);
  background-size:200% 100%;animation:progressAnim 1.2s linear infinite}
@keyframes progressAnim{0%{background-position:200% 0}100%{background-position:-200% 0}}
.main-scroll{flex:1;overflow-y:auto;padding:16px 20px 40px}

/* Request editor area */
.request-area{margin-bottom:16px}
.server-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.server-row label{font-size:11px;color:var(--fg3);text-transform:uppercase;letter-spacing:.3px;flex-shrink:0}
.server-row input{flex:1}
.desc-text{font-size:12px;color:var(--fg3);font-style:italic;margin-bottom:8px;min-height:1.2em}
.vs-editor{width:100%;min-height:80px}
.tx-area{margin-top:8px}
.tx-area label{font-size:11px;color:var(--fg3);text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:4px}
.tx-editor{width:100%;min-height:60px}
.params-editor{width:100%;min-height:90px}
.btn-add-tx{background:none;color:var(--fg3);font-size:12px;padding:4px 0;cursor:pointer;border:none;border-radius:0}
.btn-add-tx:hover{color:var(--blue)}
.run-row{display:flex;justify-content:flex-end;margin-top:10px}
.btn-run{padding:8px 20px;background:var(--blue);color:var(--bg);font-weight:700;font-size:13px;
  border-radius:var(--radius);transition:opacity .15s;align-self:flex-end}
.btn-run:hover{opacity:.85}
.btn-run:disabled{opacity:.5;cursor:wait}
.run-row{gap:8px}
.btn-compile{padding:8px 14px;background:var(--surface);color:var(--fg);font-weight:600;font-size:12px;
  border-radius:var(--radius);transition:opacity .15s;align-self:flex-end}
.btn-compile:hover{opacity:.9}
.btn-compile:disabled{opacity:.5;cursor:wait}

.error-box{background:rgba(243,139,168,.15);border:1px solid var(--red);border-radius:var(--radius);
  padding:10px 12px;color:var(--red);font-size:13px;white-space:pre-wrap;display:none;margin-top:12px}
.error-box.show{display:block}

/* Collapsible sections */
.section{margin-top:12px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--surface)}
.section-header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);cursor:pointer;
  user-select:none;border-left:3px solid var(--surface)}
.section-header:hover{background:var(--bg3)}
.section-header .chevron{font-size:10px;transition:transform .15s;flex-shrink:0;color:var(--fg3)}
.section-header.collapsed .chevron{transform:rotate(-90deg)}
.section-header .title{font-weight:600;font-size:13px;color:var(--fg)}
.section-header .stats{margin-left:auto;font-size:12px;color:var(--fg3);font-family:var(--mono)}
.section-body{display:block;padding:12px;max-height:none}
.section-body.hidden{display:none}
.section.sec-results .section-header{border-left-color:var(--teal)}
.section.sec-ir .section-header{border-left-color:var(--purple)}
.section.sec-resolvedIR .section-header{border-left-color:var(--purple)}
.section.sec-queryIR .section-header{border-left-color:var(--blue)}
.section.sec-standaloneIR .section-header{border-left-color:var(--green)}
.section.sec-standaloneBatch .section-header{border-left-color:var(--yellow)}
.section.sec-sql .section-header{border-left-color:var(--yellow)}
.section.sec-trace .section-header{border-left-color:var(--orange)}
.section.sec-raw .section-header{border-left-color:var(--fg3)}

.sql-card{background:var(--bg);border:1px solid var(--surface);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.sql-card-header{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg2);font-size:12px}
.sql-card-header .span-label{color:var(--yellow);font-weight:600;font-family:var(--mono);font-size:11px}
.sql-card-header .sql-meta{margin-left:auto;color:var(--fg3);font-family:var(--mono);font-size:11px}
.sql-card-body{padding:8px 10px}
.sql-card-body pre{font-family:var(--mono);font-size:11px;white-space:pre-wrap;word-break:break-word;color:var(--fg);line-height:1.5;margin:0}
.sql-card-body .sql-params{margin-top:6px;font-size:11px;color:var(--fg3);font-family:var(--mono)}

/* Results table */
table.results{width:100%;border-collapse:collapse;font-size:12px;table-layout:auto}
table.results th{text-align:left;padding:6px 8px;background:var(--bg3);color:var(--fg2);
  font-weight:600;position:sticky;top:0;font-size:11px;text-transform:uppercase;letter-spacing:.3px}
table.results td{padding:5px 8px;border-bottom:1px solid var(--bg3);font-family:var(--mono);font-size:11px;max-width:400px;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
table.results tr:nth-child(even) td{background:var(--bg2)}
table.results tr:hover td{background:var(--bg3)}
.desig-table{border-collapse:collapse;font-size:11px;width:auto;margin:0}
.desig-table th{text-align:left;padding:2px 6px;background:var(--bg3);color:var(--fg3);font-weight:500;font-size:10px;border-bottom:1px solid var(--border);white-space:nowrap}
.desig-table td{padding:2px 6px;border-bottom:1px solid var(--bg2);white-space:nowrap}
.desig-table td:nth-child(2){white-space:normal;min-width:180px}
table.results td:has(.desig-wrap){max-width:none;overflow:visible;padding:2px}
.desig-more{font-size:10px;color:var(--accent);cursor:pointer;padding:3px 6px}
.desig-more:hover{text-decoration:underline}
.no-results{color:var(--fg3);font-size:13px;text-align:center;padding:20px}
.results-pager{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:8px}
.results-pager .meta{font-size:12px;color:var(--fg3);font-family:var(--mono)}
.results-pager .controls{display:flex;align-items:center;gap:6px}
.results-pager .btn-page{padding:4px 10px;background:var(--surface);color:var(--fg);font-size:12px}
.results-pager .btn-page:hover{background:var(--overlay)}
.results-pager .btn-page:disabled{opacity:.45;cursor:not-allowed}

/* IR tree */
.ir-tree{font-family:var(--mono);font-size:12px}
.ir-node{margin-left:20px;border-left:2px solid var(--surface);padding:4px 0 4px 12px}
.ir-node:first-child{margin-left:0;border-left:none;padding-left:0}
.ir-badge{display:inline-block;padding:1px 7px;border-radius:3px;font-size:11px;font-weight:700;margin-right:6px;color:var(--bg)}
.ir-badge.union{background:var(--blue)}.ir-badge.intersect{background:var(--green)}
.ir-badge.diff{background:var(--red)}.ir-badge.selector{background:var(--purple)}
.ir-badge.import{background:var(--orange)}.ir-badge.empty{background:var(--fg3)}

.ir-detail{color:var(--fg2);font-size:11px;margin-top:2px}

/* JSON syntax highlighting */
.json-view{font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-word;line-height:1.6}
.json-key{color:var(--blue)}.json-string{color:var(--green)}.json-number{color:var(--orange)}
.json-bool{color:var(--purple)}.json-null{color:var(--fg3)}
.json-brace{color:var(--fg3)}

/* Trace */
.trace-spans{font-size:12px}
.trace-span{margin-bottom:2px}
.trace-span-header{display:flex;align-items:center;gap:8px;padding:3px 6px;border-radius:3px;cursor:pointer}
.trace-span-header:hover{background:var(--bg3)}
.trace-name{flex-shrink:0;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trace-bar-wrap{flex:1;height:8px;background:var(--bg3);border-radius:4px;min-width:60px}
.trace-bar{height:100%;border-radius:4px;background:var(--teal);min-width:1px}
.trace-bar.slow{background:var(--yellow)}.trace-bar.very-slow{background:var(--red)}
.trace-ms{flex-shrink:0;font-family:var(--mono);font-size:11px;color:var(--fg2);min-width:50px;text-align:right}
.trace-children{margin-left:16px;border-left:1px solid var(--surface);padding-left:8px}
.trace-sql{font-family:var(--mono);font-size:11px;background:var(--bg);padding:6px 8px;
  border-radius:3px;margin:2px 0 4px 24px;color:var(--fg3);max-height:120px;overflow:auto;display:none}
.trace-sql.show{display:block}
.trace-toggle{font-size:10px;color:var(--fg3);cursor:pointer;user-select:none}
.counters-section{margin-top:16px;padding:12px;background:var(--bg2);border-radius:var(--radius)}
.counters-section h4{font-size:12px;color:var(--fg3);margin-bottom:8px;text-transform:uppercase}
.counters-grid{display:flex;flex-wrap:wrap;gap:8px}
.counter-chip{padding:4px 10px;background:var(--bg3);border-radius:12px;font-size:12px}
.counter-chip .val{font-weight:700;color:var(--teal);margin-left:4px}

/* Raw */
.raw-wrap{position:relative}
.btn-copy{position:absolute;top:8px;right:8px;padding:4px 10px;background:var(--surface);color:var(--fg2);font-size:11px;border-radius:3px}
.btn-copy:hover{background:var(--overlay)}
pre.raw{font-family:var(--mono);font-size:11px;white-space:pre-wrap;word-break:break-word;
  background:var(--bg);padding:12px;border-radius:var(--radius);max-height:600px;overflow:auto}

.placeholder-msg{color:var(--fg3);font-size:13px;text-align:center;padding:20px}
.inline-error{background:rgba(243,139,168,.12);border:1px solid var(--red);padding:10px 12px;border-radius:var(--radius);color:var(--red);font-size:12px}
.batch-table{width:100%;border-collapse:collapse;font-size:12px}
.batch-table th,.batch-table td{padding:6px 8px;border-bottom:1px solid var(--bg3);text-align:left;vertical-align:top}
.batch-table th{background:var(--bg3);font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--fg2)}
.batch-ok{color:var(--green);font-weight:700}
.batch-fail{color:var(--red);font-weight:700}
</style>
</head>
<body>
<div class="app">

  <!-- Left Sidebar -->
  <div class="sidebar" id="sidebar">
    <h2>Test Cases</h2>
  </div>

  <!-- Main Content -->
  <div class="main">
    <div class="progress-bar" id="progressBar"></div>
    <div class="main-scroll" id="mainScroll">

      <!-- Request Editor -->
      <div class="request-area">
        <div class="server-row">
          <label>Server</label>
          <input type="text" id="serverUrl">
        </div>
        <div class="desc-text" id="testDesc">Select a test case or edit the ValueSet below.</div>
        <textarea class="vs-editor" id="vsEditor" spellcheck="false"></textarea>
        <div id="txArea" class="tx-area" style="display:none">
          <label>TX Resources (<span id="txCount">0</span>)</label>
          <textarea class="tx-editor" id="txEditor" spellcheck="false"></textarea>
        </div>
        <div id="addTxRow" style="margin-top:4px"><button class="btn-add-tx" id="btnAddTx">+ Add TX Resources</button></div>
        <div class="tx-area" id="paramsArea">
          <label>Expand Params (JSON object)</label>
          <textarea class="tx-editor params-editor" id="paramsEditor" spellcheck="false">{}</textarea>
        </div>
        <div class="run-row">
          <button class="btn-compile" id="btnCompile">Compile IR</button>
          <button class="btn-compile" id="btnCompileAll">Compile All Cases</button>
          <button class="btn-run" id="btnRun">Run</button>
        </div>
      </div>

      <div class="error-box" id="errorBox"></div>

      <!-- Collapsible sections -->
      <div id="sectionsContainer">
        <div class="placeholder-msg" id="placeholderMsg">Select a test case to begin.</div>
      </div>
    </div>
  </div>

</div>

<script src="js/expand-explorer-test-cases.js"></script>
<script src="js/standalone-vs-ir-compiler.js"></script>
<script>
/* ===== Test Cases ===== */
const TEST_CASES = globalThis.EXPAND_EXPLORER_TEST_CASES || [];

/* ===== State ===== */
let currentResponse = null;
let pendingAbort = null;
let sectionStates = {results:true, ir:true, resolvedIR:true, queryIR:true, standaloneIR:true, standaloneBatch:true, trace:true, raw:false};
let resultsPager = { page: 0, pageSize: 15 };
let currentStandaloneCompile = null;
let standaloneBatchReport = null;

/* ===== Init ===== */
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('serverUrl').value = window.__EXPAND_EXPLORER_BASE_URL__ || (location.origin + '/r4');
  buildSidebar();
  setupEvents();
  loadFromHash();
  window.addEventListener('hashchange', loadFromHash);
});

/* ===== Sidebar ===== */
function buildSidebar() {
  const sidebar = document.getElementById('sidebar');
  const categories = [...new Set(TEST_CASES.map(t => t.category))];
  for (const cat of categories) {
    const items = TEST_CASES.filter(t => t.category === cat);
    const hdr = document.createElement('div');
    hdr.className = 'cat-header';
    hdr.innerHTML = `<span class="arrow">▼</span>${esc(cat)} <span style="color:var(--fg3);font-weight:400;font-size:11px">(${items.length})</span>`;
    const list = document.createElement('div');
    list.className = 'cat-items';
    for (const tc of items) {
      const el = document.createElement('div');
      el.className = 'test-item';
      el.textContent = tc.name;
      el.title = tc.description;
      el.addEventListener('click', () => selectTest(tc));
      list.appendChild(el);
    }
    hdr.addEventListener('click', () => {
      hdr.classList.toggle('collapsed');
      list.classList.toggle('hidden');
    });
    sidebar.appendChild(hdr);
    sidebar.appendChild(list);
  }
}

function selectTest(tc) {
  resultsPager.page = 0;
  document.querySelectorAll('.test-item').forEach(el => el.classList.toggle('active', el.textContent === tc.name));
  document.getElementById('vsEditor').value = JSON.stringify(tc.valueSet, null, 2);
  document.getElementById('testDesc').textContent = tc.description;

  const p = tc.params || {};
  document.getElementById('paramsEditor').value = JSON.stringify(p, null, 2);

  // txResources
  if (tc.txResources && tc.txResources.length) {
    showTxEditor(tc.txResources);
  } else {
    hideTxEditor();
  }

  location.hash = encodeURIComponent(tc.name);
  resizeEditor();
  resizeParamsEditor();
  doExpand(); // auto-expand
}

function showTxEditor(txResources) {
  const area = document.getElementById('txArea');
  const editor = document.getElementById('txEditor');
  const countEl = document.getElementById('txCount');
  area.style.display = 'block';
  document.getElementById('addTxRow').style.display = 'none';
  editor.value = JSON.stringify(txResources, null, 2);
  countEl.textContent = txResources.length;
  resizeTxEditor();
}

function hideTxEditor() {
  document.getElementById('txArea').style.display = 'none';
  document.getElementById('txEditor').value = '';
  document.getElementById('addTxRow').style.display = 'block';
}

function normalizeHashKey(raw) {
  if (!raw) return '';
  return decodeURIComponent(String(raw).replace(/\+/g, ' ')).trim();
}

function slugifyName(name) {
  return String(name || '')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
}

function findTestByHashKey(hashKey) {
  const key = normalizeHashKey(hashKey);
  if (!key) return null;

  // 1) Exact (preferred)
  let tc = TEST_CASES.find(t => t.name === key);
  if (tc) return tc;

  // 2) Case-insensitive exact
  const lower = key.toLowerCase();
  tc = TEST_CASES.find(t => String(t.name || '').toLowerCase() === lower);
  if (tc) return tc;

  // 3) Slug fallback (permits stable links even if punctuation differs)
  const slug = slugifyName(key);
  tc = TEST_CASES.find(t => slugifyName(t.name) === slug);
  return tc || null;
}

function loadFromHash() {
  if (!location.hash) return;
  const tc = findTestByHashKey(location.hash.slice(1));
  if (tc) selectTest(tc);
}

/* ===== Events ===== */
function setupEvents() {
  document.getElementById('btnRun').addEventListener('click', doExpand);
  document.getElementById('btnCompile').addEventListener('click', compileCurrentOnly);
  document.getElementById('btnCompileAll').addEventListener('click', compileAllCases);
  document.getElementById('btnAddTx').addEventListener('click', () => {
    showTxEditor([]);
    document.getElementById('txEditor').value = '[\n  \n]';
    document.getElementById('txCount').textContent = '0';
  });
  document.getElementById('vsEditor').addEventListener('input', resizeEditor);
  document.getElementById('txEditor').addEventListener('input', resizeTxEditor);
  document.getElementById('paramsEditor').addEventListener('input', resizeParamsEditor);
}

/* ===== Expand ===== */
function gatherParams() {
  const raw = (document.getElementById('paramsEditor').value || '').trim();
  if (!raw) return {};
  const parsed = JSON.parse(raw);
  if (!parsed || Array.isArray(parsed) || typeof parsed !== 'object') {
    throw new Error('Params JSON must be an object');
  }
  return parsed;
}

async function doExpand() {
  const btn = document.getElementById('btnRun');
  const errorBox = document.getElementById('errorBox');
  const progressBar = document.getElementById('progressBar');
  errorBox.classList.remove('show');

  // Cancel previous pending request
  if (pendingAbort) { pendingAbort.abort(); pendingAbort = null; }

  let parsed;
  try {
    parsed = parseCurrentRequestEditors();
  } catch (e) {
    errorBox.textContent = 'Invalid Params JSON: ' + e.message;
    errorBox.classList.add('show');
    return;
  }
  const vsJson = parsed.valueSet;
  const txResources = parsed.txResources;
  const params = parsed.params;
  const url = document.getElementById('serverUrl').value.replace(/\/+$/, '') + '/debug/expand';

  btn.disabled = true;
  progressBar.classList.add('loading');
  document.getElementById('placeholderMsg')?.remove();

  const abortController = new AbortController();
  pendingAbort = abortController;

  try {
    await compileStandaloneInput(parsed, { suppressThrow: true });
    const body = { valueSet: vsJson, params };
    if (txResources && txResources.length) body.txResources = txResources;

    const resp = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
      signal: abortController.signal
    });
    const data = await resp.json();
    if (abortController.signal.aborted) return;
    if (!resp.ok) {
      errorBox.textContent = data.error || `HTTP ${resp.status}`;
      errorBox.classList.add('show');
      currentResponse = data;
      resultsPager.page = 0;
      renderSections(data);
      return;
    }
    currentResponse = data;
    resultsPager.page = 0;
    renderSections(data);
    // Auto-scroll results into view
    const firstSec = document.querySelector('.sec-results');
    if (firstSec) firstSec.scrollIntoView({behavior:'auto', block:'start'});
  } catch (e) {
    if (e.name === 'AbortError') return;
    errorBox.textContent = 'Network error: ' + e.message;
    errorBox.classList.add('show');
  } finally {
    if (pendingAbort === abortController) pendingAbort = null;
    btn.disabled = false;
    progressBar.classList.remove('loading');
  }
}

function parseCurrentRequestEditors() {
  let valueSet;
  try {
    valueSet = JSON.parse(document.getElementById('vsEditor').value);
  } catch (e) {
    throw new Error('ValueSet JSON: ' + e.message);
  }

  let txResources = [];
  const txArea = document.getElementById('txArea');
  if (txArea.style.display !== 'none') {
    const txVal = document.getElementById('txEditor').value.trim();
    if (txVal) {
      try {
        txResources = JSON.parse(txVal);
        if (!Array.isArray(txResources)) throw new Error('txResources must be an array');
      } catch (e) {
        throw new Error('TX Resources JSON: ' + e.message);
      }
    }
  }

  let params;
  try {
    params = gatherParams();
  } catch (e) {
    throw new Error('Params JSON: ' + e.message);
  }

  return { valueSet, txResources, params };
}

function makeFhirParamEntries(name, value) {
  if (Array.isArray(value)) {
    return value.flatMap(v => makeFhirParamEntries(name, v));
  }
  if (value === null || value === undefined) return [];
  if (typeof value === 'boolean') return [{ name, valueBoolean: value }];
  if (typeof value === 'number') {
    if (Number.isInteger(value)) return [{ name, valueInteger: value }];
    return [{ name, valueDecimal: value }];
  }
  if (typeof value === 'string') {
    if (name === 'url' || name === 'system-version' || name === 'check-system-version' || name === 'force-system-version') {
      return [{ name, valueCanonical: value }];
    }
    if (name === 'useSupplement') return [{ name, valueCanonical: value }];
    return [{ name, valueString: value }];
  }
  if (typeof value === 'object' && value.resourceType) return [{ name, resource: value }];
  return [{ name, valueString: JSON.stringify(value) }];
}

function makeFhirParametersFromObject(paramsObj, txResources) {
  const parameter = [];
  for (const [name, value] of Object.entries(paramsObj || {})) {
    parameter.push(...makeFhirParamEntries(name, value));
  }
  for (const r of txResources || []) {
    if (r && typeof r === 'object' && r.resourceType) parameter.push({ name: 'tx-resource', resource: r });
  }
  return { resourceType: 'Parameters', parameter };
}

async function compileStandaloneInput(parsed, { suppressThrow = false } = {}) {
  const t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  try {
    const api = globalThis.ValueSetIRCompiler;
    if (!api || typeof api.compileValueSetIR !== 'function') {
      throw new Error('Standalone compiler is not loaded (/js/standalone-vs-ir-compiler.js)');
    }

    const parameters = makeFhirParametersFromObject(parsed.params || {}, parsed.txResources || []);
    const result = await api.compileValueSetIR({
      valueSet: parsed.valueSet,
      parameters,
      additionalResources: parsed.txResources || [],
    });
    const dt = (((typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now()) - t0);
    currentStandaloneCompile = { ok: true, ms: dt, result };
    return currentStandaloneCompile;
  } catch (e) {
    currentStandaloneCompile = { ok: false, error: e && e.message ? e.message : String(e) };
    if (!suppressThrow) throw e;
    return currentStandaloneCompile;
  }
}

async function compileCurrentOnly() {
  const errorBox = document.getElementById('errorBox');
  errorBox.classList.remove('show');
  try {
    const parsed = parseCurrentRequestEditors();
    await compileStandaloneInput(parsed, { suppressThrow: false });
  } catch (e) {
    errorBox.textContent = e.message || String(e);
    errorBox.classList.add('show');
  }
  if (currentResponse) renderSections(currentResponse);
  else renderStandaloneSectionsOnly();
}

async function compileAllCases() {
  const btn = document.getElementById('btnCompileAll');
  btn.disabled = true;
  const t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  const rows = [];
  try {
    const api = globalThis.ValueSetIRCompiler;
    if (!api || typeof api.compileValueSetIR !== 'function') {
      throw new Error('Standalone compiler is not loaded (/js/standalone-vs-ir-compiler.js)');
    }

    for (const tc of TEST_CASES) {
      const st = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
      try {
        const parameters = makeFhirParametersFromObject(tc.params || {}, tc.txResources || []);
        const out = await api.compileValueSetIR({
          valueSet: tc.valueSet,
          parameters,
          additionalResources: tc.txResources || [],
        });
        const et = (((typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now()) - st);
        rows.push({
          name: tc.name,
          ok: true,
          ms: et,
          diag: out?.diagnostics || {},
        });
      } catch (e) {
        const et = (((typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now()) - st);
        rows.push({
          name: tc.name,
          ok: false,
          ms: et,
          error: e && e.message ? e.message : String(e),
        });
      }
    }
  } catch (e) {
    rows.push({ name: '(batch setup)', ok: false, ms: 0, error: e.message || String(e) });
  } finally {
    btn.disabled = false;
  }

  const totalMs = (((typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now()) - t0);
  const passed = rows.filter(r => r.ok).length;
  standaloneBatchReport = { rows, passed, failed: rows.length - passed, total: rows.length, ms: totalMs };
  if (currentResponse) renderSections(currentResponse);
  else renderStandaloneSectionsOnly();
}

function renderStandaloneSectionsOnly() {
  const container = document.getElementById('sectionsContainer');
  container.innerHTML = '';
  addSection(container, 'standaloneIR', 'Standalone Compiler IR', standaloneCompileStats(), (el) => renderStandaloneIR(el));
  if (standaloneBatchReport) {
    addSection(container, 'standaloneBatch', 'Standalone Compiler Batch', standaloneBatchStats(), (el) => renderStandaloneBatch(el));
  }
}

/* ===== Render Sections ===== */
function renderSections(data) {
  const container = document.getElementById('sectionsContainer');
  container.innerHTML = '';

  const exp = data.result?.expansion;
  const returned = exp?.contains?.length ?? 0;
  const total = exp?.total ?? '?';
  const ms = data.ms ?? '?';

  // Trace stats
  let spanCount = 0, sqlCount = 0;
  if (data.trace?.spans) countSpans(data.trace.spans);
  function countSpans(spans) { for (const s of spans) { spanCount++; if (s.sql) sqlCount += s.sql.length; if (s.children) countSpans(s.children); } }
  const traceMs = data.trace?.totalMs ?? ms;

  // Results
  addSection(container, 'results', 'Results',
    `${returned} codes${total !== '?' ? ' / '+total+' total' : ''}, ${ms}ms`,
    (el) => renderResults(data, el));

  // Semantic IR
  addSection(container, 'ir', 'Semantic IR', '', (el) => renderIR(data.ir, el));

  // Resolved IR
  addSection(container, 'resolvedIR', 'Resolved IR', '', (el) => renderResolvedIR(data.resolvedIR, el));

  // Query IR
  addSection(container, 'queryIR', 'Query IR', '', (el) => renderQueryIR(data.queryIR, el));

  // Standalone compiler IR
  addSection(container, 'standaloneIR', 'Standalone Compiler IR', standaloneCompileStats(), (el) => renderStandaloneIR(el));

  // Standalone compiler batch
  if (standaloneBatchReport) {
    addSection(container, 'standaloneBatch', 'Standalone Compiler Batch', standaloneBatchStats(), (el) => renderStandaloneBatch(el));
  }

  // Trace
  addSection(container, 'trace', 'Trace',
    `${spanCount} spans, ${sqlCount} SQL, ${traceMs}ms`,
    (el) => renderTrace(data.trace, el));

  // Raw
  addSection(container, 'raw', 'Raw Response', '', (el) => renderRaw(data, el));
}

function addSection(container, key, title, stats, renderFn) {
  const sec = document.createElement('div');
  sec.className = `section sec-${key}`;

  const isOpen = sectionStates[key];
  const hdr = document.createElement('div');
  hdr.className = 'section-header' + (isOpen ? '' : ' collapsed');
  hdr.innerHTML = `<span class="chevron">${isOpen ? '▾' : '▸'}</span><span class="title">${esc(title)}</span><span class="stats">${esc(stats)}</span>`;

  const body = document.createElement('div');
  body.className = 'section-body' + (isOpen ? '' : ' hidden');

  hdr.addEventListener('click', () => {
    const nowOpen = hdr.classList.toggle('collapsed');
    body.classList.toggle('hidden');
    sectionStates[key] = !nowOpen;
    hdr.querySelector('.chevron').textContent = nowOpen ? '▸' : '▾';
    // Lazy render on first open
    if (!nowOpen && !body.dataset.rendered) {
      renderFn(body);
      body.dataset.rendered = '1';
    }
  });

  if (isOpen) {
    renderFn(body);
    body.dataset.rendered = '1';
  }

  sec.appendChild(hdr);
  sec.appendChild(body);
  container.appendChild(sec);
}

/* ===== Results ===== */
function renderResults(data, bodyEl) {
  const target = bodyEl || document.querySelector('.sec-results .section-body');
  const vs = data.result;
  const exp = vs?.expansion;
  if (!exp) { target.innerHTML = '<div class="placeholder-msg">No expansion in response.</div>'; return; }

  const contains = exp.contains || [];
  const returned = contains.length;
  if (returned === 0) { target.innerHTML = '<div class="no-results">No concepts in expansion</div>'; return; }

  const hasProps = contains.some(c => c.property?.length);
  const hasDesig = contains.some(c => c.designation?.length);
  const pageSize = Math.max(1, Number(resultsPager.pageSize || 15));
  const pageCount = Math.max(1, Math.ceil(returned / pageSize));
  if (resultsPager.page >= pageCount) resultsPager.page = pageCount - 1;
  const page = Math.max(0, resultsPager.page);
  const start = page * pageSize;
  const end = Math.min(start + pageSize, returned);
  const windowed = contains.slice(start, end);

  let html = `<div class="results-pager"><div class="meta">Rows ${start + 1}-${end} of ${returned} (page ${page + 1}/${pageCount})</div>`;
  html += `<div class="controls"><button class="btn-page" onclick="setResultsPage(${page - 1})" ${page <= 0 ? 'disabled' : ''}>Prev</button>`;
  html += `<button class="btn-page" onclick="setResultsPage(${page + 1})" ${page >= pageCount - 1 ? 'disabled' : ''}>Next</button></div></div>`;
  html += '<table class="results"><thead><tr><th>System</th><th>Code</th><th>Display</th>';
  if (hasProps) html += '<th>Properties</th>';
  if (hasDesig) html += '<th>Designations</th>';
  html += '</tr></thead><tbody>';

  for (const c of windowed) {
    const sys = shortSystem(c.system);
    const props = (c.property || []).map(p => `${p.code}=${propVal(p)}`).join('; ');
    html += `<tr><td title="${esc(c.system||'')}">${esc(sys)}</td><td>${esc(c.code||'')}</td><td>${esc(c.display||'')}</td>`;
    if (hasProps) html += `<td>${esc(props)}</td>`;
    if (hasDesig) html += '<td>' + renderDesignations(c.designation) + '</td>';
    html += '</tr>';
  }
  html += '</tbody></table>';
  target.innerHTML = html;
}

function setResultsPage(nextPage) {
  const n = Number(nextPage);
  if (!Number.isFinite(n)) return;
  resultsPager.page = Math.max(0, Math.floor(n));
  if (currentResponse) renderResults(currentResponse);
}

function propVal(p) {
  if (p.valueString !== undefined) return p.valueString;
  if (p.valueCode !== undefined) return p.valueCode;
  if (p.valueInteger !== undefined) return String(p.valueInteger);
  if (p.valueBoolean !== undefined) return String(p.valueBoolean);
  if (p.valueCoding) return `${p.valueCoding.code}`;
  if (p.valueDecimal !== undefined) return String(p.valueDecimal);
  if (p.valueDateTime !== undefined) return p.valueDateTime;
  return JSON.stringify(p);
}

function renderDesignations(desigs) {
  if (!desigs || desigs.length === 0) return '';
  const limit = 5;
  const show = desigs.slice(0, limit);
  const overflow = desigs.length > limit;
  let h = '<div class="desig-wrap' + (overflow ? ' desig-overflow' : '') + '">';
  h += '<table class="desig-table"><thead><tr><th>Lang</th><th>Value</th><th>Use</th></tr></thead><tbody>';
  for (const d of show) {
    const use = d.use ? esc((d.use.code || '') + (d.use.system ? ' (' + shortSystem(d.use.system) + ')' : '')) : '';
    h += `<tr><td>${esc(d.language||'')}</td><td>${esc(d.value||'')}</td><td>${use}</td></tr>`;
  }
  h += '</tbody></table>';
  if (overflow) h += `<div class="desig-more">+ ${desigs.length - limit} more</div>`;
  h += '</div>';
  return h;
}

function shortSystem(sys) {
  if (!sys) return '';
  return sys.replace('http://hl7.org/fhir/', '').replace('http://snomed.info/sct', 'SNOMED').replace('http://loinc.org', 'LOINC')
    .replace('http://www.nlm.nih.gov/research/umls/rxnorm', 'RxNorm').replace('https://www.usps.com/', 'USPS')
    .replace('urn:iso:std:iso:4217', 'ISO4217').replace('urn:iso:std:iso:3166', 'ISO3166')
    .replace('http://unstats.un.org/unsd/methods/m49/m49.htm', 'M49')
    .replace('http://terminology.hl7.org/CodeSystem/', 'THO/')
    .replace('http://example.org/cs/', 'ex/')
    .replace('http://example.org/vs/', 'ex/vs/');
}

/* ===== Semantic IR ===== */
function renderIR(ir, bodyEl) {
  const target = bodyEl || document.querySelector('.sec-ir .section-body');
  if (!ir) { target.innerHTML = '<div class="placeholder-msg">No IR data.</div>'; return; }
  target.innerHTML = '<div class="ir-tree">' + renderIRNode(ir) + '</div>';
}

function renderIRNode(node) {
  if (!node) return '';
  const badge = `<span class="ir-badge ${node.kind}">${esc(node.kind)}</span>`;
  let detail = '';
  if (node.kind === 'selector') {
    detail = `<div class="ir-detail">system: ${esc(node.system||'')}`;
    if (node.version) detail += ` v${esc(node.version)}`;
    if (node.shape) detail += ` | shape: ${esc(node.shape)}`;
    if (node.conceptCodes?.length) detail += ` | codes: ${esc(node.conceptCodes.map(c => c.code || c).join(', '))}`;
    if (node.filterClauses?.length) detail += ` | filters: ${node.filterClauses.map(f => `<span style="color:var(--teal)">${esc(f.property)} ${esc(f.op)} ${esc(f.value)}</span>`).join(', ')}`;
    if (node.text) detail += ` | text: "${esc(node.text)}"`;
    detail += '</div>';
  } else if (node.kind === 'import') {
    detail = `<div class="ir-detail">url: ${esc(node.url||'')}${node.version ? ' v'+esc(node.version) : ''}</div>`;
  }
  let children = '';
  if (node.items) children = node.items.map(i => `<div class="ir-node">${renderIRNode(i)}</div>`).join('');
  if (node.kind === 'diff') {
    children = `<div class="ir-node"><span style="color:var(--fg3)">left:</span> ${renderIRNode(node.left)}</div>` +
               `<div class="ir-node"><span style="color:var(--fg3)">right:</span> ${renderIRNode(node.right)}</div>`;
  }
  if (node.resolved) children += `<div class="ir-node"><span style="color:var(--fg3)">resolved:</span> ${renderIRNode(node.resolved)}</div>`;
  return badge + detail + children;
}

/* ===== Resolved IR ===== */
function renderResolvedIR(ir, bodyEl) {
  const target = bodyEl || document.querySelector('.sec-resolvedIR .section-body');
  if (!ir) { target.innerHTML = '<div class="placeholder-msg">No resolved IR data.</div>'; return; }
  target.innerHTML = '<div class="ir-tree">' + renderIRNode(ir) + '</div>';
}

/* ===== Query IR ===== */
function renderQueryIR(qir, bodyEl) {
  const target = bodyEl || document.querySelector('.sec-queryIR .section-body');
  if (qir === null || qir === undefined) { target.innerHTML = '<div class="placeholder-msg">Expression not compilable to single-provider query</div>'; return; }
  target.innerHTML = '<div class="json-view">' + syntaxHighlight(JSON.stringify(qir, null, 2)) + '</div>';
}

function standaloneCompileStats() {
  if (!currentStandaloneCompile) return 'not run';
  if (!currentStandaloneCompile.ok) return 'error';
  const ms = Number(currentStandaloneCompile.ms || 0).toFixed(1);
  return `${ms}ms`;
}

function standaloneBatchStats() {
  if (!standaloneBatchReport) return 'not run';
  const ms = Number(standaloneBatchReport.ms || 0).toFixed(1);
  return `${standaloneBatchReport.passed}/${standaloneBatchReport.total} pass, ${ms}ms`;
}

function renderStandaloneIR(bodyEl) {
  const target = bodyEl || document.querySelector('.sec-standaloneIR .section-body');
  if (!currentStandaloneCompile) {
    target.innerHTML = '<div class="placeholder-msg">Run a case or click Compile IR.</div>';
    return;
  }
  if (!currentStandaloneCompile.ok) {
    target.innerHTML = `<div class="inline-error">${esc(currentStandaloneCompile.error || 'Compile failed')}</div>`;
    return;
  }

  const out = currentStandaloneCompile.result || {};
  let html = `<div class="json-view" style="margin-bottom:10px">${syntaxHighlight(JSON.stringify(out.diagnostics || {}, null, 2))}</div>`;
  html += '<div style="font-size:12px;color:var(--fg3);margin-bottom:4px">Basic IR</div>';
  html += '<div class="ir-tree" style="margin-bottom:10px">' + renderIRNode(out.basicIR) + '</div>';
  html += '<div style="font-size:12px;color:var(--fg3);margin-bottom:4px">Resolved IR</div>';
  html += '<div class="ir-tree" style="margin-bottom:10px">' + renderIRNode(out.resolvedIR) + '</div>';
  html += '<div style="font-size:12px;color:var(--fg3);margin-bottom:4px">Lowered IR</div>';
  html += '<div class="ir-tree">' + renderIRNode(out.loweredIR) + '</div>';
  target.innerHTML = html;
}

function renderStandaloneBatch(bodyEl) {
  const target = bodyEl || document.querySelector('.sec-standaloneBatch .section-body');
  if (!standaloneBatchReport) {
    target.innerHTML = '<div class="placeholder-msg">Click Compile All Cases to run all explorer test cases through standalone compiler.</div>';
    return;
  }

  let html = '<table class="batch-table"><thead><tr><th>Case</th><th>Status</th><th>ms</th><th>Detail</th></tr></thead><tbody>';
  for (const row of standaloneBatchReport.rows || []) {
    const status = row.ok ? '<span class="batch-ok">PASS</span>' : '<span class="batch-fail">FAIL</span>';
    const detail = row.ok ? esc(JSON.stringify(row.diag || {})) : esc(row.error || '');
    html += `<tr><td>${esc(row.name || '')}</td><td>${status}</td><td>${Number(row.ms || 0).toFixed(1)}</td><td>${detail}</td></tr>`;
  }
  html += '</tbody></table>';
  target.innerHTML = html;
}

function syntaxHighlight(json) {
  return esc(json).replace(/"([^"]+)"(?=\s*:)/g, '<span class="json-key">"$1"</span>')
    .replace(/: "([^"]*)"/g, ': <span class="json-string">"$1"</span>')
    .replace(/: (-?\d+\.?\d*)/g, ': <span class="json-number">$1</span>')
    .replace(/: (true|false)/g, ': <span class="json-bool">$1</span>')
    .replace(/: (null)/g, ': <span class="json-null">$1</span>')
    .replace(/([{}\[\]])/g, '<span class="json-brace">$1</span>');
}

/* ===== SQL Queries ===== */
function renderSqlSection(allSql, bodyEl) {
  let html = '';
  for (let i = 0; i < allSql.length; i++) {
    const q = allSql[i];
    html += '<div class="sql-card">';
    html += `<div class="sql-card-header"><span class="span-label">${esc(q.span || 'unknown')}</span>`;
    html += `<span class="sql-meta">${q.rows !== undefined ? q.rows + ' rows' : ''}${q.ms !== undefined ? ' · ' + q.ms + ' ms' : ''}</span></div>`;
    html += '<div class="sql-card-body">';
    html += `<pre>${highlightSql(q.sql || '')}</pre>`;
    if (q.params && Object.keys(q.params).length) {
      html += `<div class="sql-params">Params: ${esc(JSON.stringify(q.params))}</div>`;
    }
    html += '</div></div>';
  }
  bodyEl.innerHTML = html || '<div class="placeholder-msg">No SQL queries.</div>';
}

function highlightSql(sql) {
  const keywords = /\b(SELECT|DISTINCT|FROM|WHERE|JOIN|ON|AND|OR|NOT|IN|EXISTS|AS|ORDER BY|GROUP BY|HAVING|LIMIT|OFFSET|UNION|EXCEPT|INTERSECT|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|INDEX|TEMP|TEMPORARY|IF|CASE|WHEN|THEN|ELSE|END|COUNT|SUM|MAX|MIN|AVG|LIKE|BETWEEN|IS|NULL|LEFT|RIGHT|INNER|OUTER|CROSS|WITH|RECURSIVE|COLLATE|NOCASE|ASC|DESC)\b/gi;
  return esc(sql).replace(keywords, '<span style="color:var(--blue);font-weight:600">$1</span>')
    .replace(/@\w+/g, '<span style="color:var(--orange)">$&</span>');
}

/* ===== Trace ===== */
function renderTrace(trace, bodyEl) {
  const target = bodyEl || document.querySelector('.sec-trace .section-body');
  if (!trace) { target.innerHTML = '<div class="placeholder-msg">No trace data.</div>'; return; }

  const totalMs = trace.totalMs || 1;
  let html = '<div class="trace-spans">';
  if (trace.spans) {
    for (const span of trace.spans) html += renderSpan(span, totalMs);
  }
  html += '</div>';

  if (trace.counters && Object.keys(trace.counters).length) {
    html += '<div class="counters-section"><h4>Counters</h4><div class="counters-grid">';
    for (const [k, v] of Object.entries(trace.counters)) {
      html += `<div class="counter-chip">${esc(k)}<span class="val">${v}</span></div>`;
    }
    html += '</div></div>';
  }
  target.innerHTML = html;
}

function renderSpan(span, totalMs) {
  if (span.name === 'note') {
    return `<div class="trace-span"><div class="trace-span-header" style="opacity:.7">` +
      `<span class="trace-name" title="${esc(span.message||'')}" style="color:var(--fg3);font-style:italic">📝 ${esc(span.message||'note')}</span>` +
      `<div class="trace-bar-wrap"></div>` +
      `<span class="trace-ms" style="color:var(--fg3)">${span.t != null ? span.t + ' ms' : ''}</span>` +
      `</div></div>`;
  }
  const ms = span.ms ?? 0;
  const pct = Math.max(1, (ms / totalMs) * 100);
  const barClass = ms > totalMs * 0.5 ? 'very-slow' : ms > totalMs * 0.2 ? 'slow' : '';

  let html = '<div class="trace-span">';
  html += `<div class="trace-span-header">`;
  html += `<span class="trace-name" title="${esc(span.name)}">${esc(span.name)}</span>`;
  html += `<div class="trace-bar-wrap"><div class="trace-bar ${barClass}" style="width:${pct}%"></div></div>`;
  html += `<span class="trace-ms">${ms.toFixed?.(1) ?? ms} ms</span>`;
  html += '</div>';

  if (span.sql?.length) {
    for (const s of span.sql) {
      html += '<div class="sql-card" style="margin:4px 0 4px 24px">';
      const labelHtml = s.label ? `<span style="color:var(--teal);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.3px">${esc(s.label)}</span>` : '';
      html += `<div class="sql-card-header">${labelHtml}<span class="sql-meta">${s.rows !== undefined ? s.rows + ' rows' : ''}${s.ms !== undefined ? ' · ' + s.ms + ' ms' : ''}</span></div>`;
      html += `<div class="sql-card-body"><pre>${highlightSql(s.sql || '')}</pre>`;
      if (s.params && Object.keys(s.params).length) {
        html += `<div class="sql-params">Params: ${esc(JSON.stringify(s.params))}</div>`;
      }
      html += '</div></div>';
    }
  }

  if (span.children?.length) {
    html += '<div class="trace-children">';
    for (const child of span.children) html += renderSpan(child, totalMs);
    html += '</div>';
  }
  html += '</div>';
  return html;
}

/* ===== Raw ===== */
function renderRaw(data, bodyEl) {
  const target = bodyEl || document.querySelector('.sec-raw .section-body');
  const json = JSON.stringify(data, null, 2);
  target.innerHTML = `<div class="raw-wrap"><button class="btn-copy" onclick="copyRaw()">Copy</button><pre class="raw">${esc(json)}</pre></div>`;
}

function copyRaw() {
  if (!currentResponse) return;
  navigator.clipboard.writeText(JSON.stringify(currentResponse, null, 2)).then(() => {
    const btn = document.querySelector('.btn-copy');
    if (btn) { btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy', 1500); }
  });
}

/* ===== Textarea auto-resize ===== */
function resizeEditor() {
  const ta = document.getElementById('vsEditor');
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
}

function resizeTxEditor() {
  const ta = document.getElementById('txEditor');
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
  try {
    const arr = JSON.parse(ta.value);
    if (Array.isArray(arr)) document.getElementById('txCount').textContent = arr.length;
  } catch {}
}

function resizeParamsEditor() {
  const ta = document.getElementById('paramsEditor');
  if (!ta) return;
  ta.style.height = 'auto';
  ta.style.height = Math.min(Math.max(ta.scrollHeight, 90), 360) + 'px';
}

/* ===== Helpers ===== */
function esc(s) {
  if (typeof s !== 'string') s = String(s ?? '');
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
