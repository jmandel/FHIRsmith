name: GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - rework-expand-codex-2

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build static explorer site bundle
        run: |
          bash scripts/build-expand-explorer.sh "" ./dist/pages

      - name: Add index.html redirect
        run: |
          cat > ./dist/pages/index.html <<'HTML'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=expand-explorer.html">
              <title>FHIRsmith Explorer</title>
            </head>
            <body>
              <p>Redirecting to <a href="expand-explorer.html">expand-explorer.html</a> ...</p>
            </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

