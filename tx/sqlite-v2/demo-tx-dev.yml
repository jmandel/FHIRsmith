# tx-dev-equivalent variant of demo.yml (docs/sqlite-v2-reference-server.md): the same sources plus
# the SNOMED CT and LOINC versions tx-dev.fhir.org has, with its defaults: SNOMED CT International
# 20260701 (owner decision J3, 2026-11-02), LOINC 2.83, RxNorm 03022026; an edition-only pin
# names that edition's latest version (US: 20250901).
#
# FHIRsmith library for the sqlite-v2 demo: tx.fhir.org's smaller sources (tx/tx.fhir.org.yml, same
# prefixes, so resource ids match) with the sqlite-v2 files in place of its SNOMED CT, LOINC and
# RxNorm sources.
#
# Files are looked up in <FHIRSMITH_DATA_DIR>/terminology-cache/. Missing ones are downloaded from
# base.url (the public tx-fhir-org bucket); the sqlite-v2 files are not in that bucket and must be
# built (npm run tx-import -- sct-v2|loinc-v2|rxnorm-v2 ...) or copied there first.
#
# ICD-11 (MMS, ICF, Foundation) is tx.fhir.org's own file from the bucket (461 MB).
# VSAC is commented out below: internal:vsac needs an NLM UMLS API key in config.json
# (modules.tx.vsacCfg = {"apiKey": "...", "refreshIntervalHours": 24}; keep that file mode 0600),
# and the server will not start with the line enabled and no key. With a key, the first start
# syncs every VSAC value set and its versions into terminology-cache/vsac/vsac-valuesets.db.
# The public demo has both enabled.
# LOINC 2.77 uses main's provider: the bucket has its main-format file and there are no 2.77
# release files to build a sqlite-v2 file from. UK, NL, the LOINC extension and the test edition
# are reverse-loaded from tx.fhir.org's caches (docs/sqlite-v2-sct-from-cache.md).
# CPT: CodeSystem-cpt-2023.db is licensed AMA content and is not in the bucket; build it locally
# from a UMLS release (needs a UMLS licence) with tx/importers/import-cpt-umls.js. Without it the
# public 7-concept fragment is used.
# A server-known supplement (e.g. tx.fhir.org's Uzbek LOINC supplement) can be added as
#   - file:/path/to/loinc-supplement-uz.json

base:
  url: https://storage.googleapis.com/tx-fhir-org

sources:
  - internal:lang
  - internal:country
  - internal:currency
  - internal:areacode
  - internal:mimetypes
  - internal:usstates
  - internal:urls
  - internal:hgvs
  - ucum:tx/data/ucum-essence.xml
  - sqlite-v2:sct-intl-20250201.db
  - sqlite-v2:sct-us-20250901.db
  - sqlite-v2!:sct-intl-20260701.db
  - sqlite-v2:sct-us-20240301.db
  - sqlite-v2:sct-us-20230301.db
  - sqlite-v2:sct-uk-20230412.db
  - sqlite-v2:sct-nl-20260930.db
  - sqlite-v2:sct-loinc-20261021.db
  - sqlite-v2:sct-test-20250909-nl.db
  - sqlite-v2!:loinc-2.83.db
  - sqlite-v2:loinc-2.82.db
  - loinc:loinc-2.77-a.db
  - sqlite-v2!:rxnorm-03022026.db
  - ndc:ndc-20211101.db
  - unii:unii_20240622.db
  - cpt:CodeSystem-cpt-2023.db|cpt-2023-fragment-0.1.db
  - omop:omop_v20250227.db
  - npm:hl7.terminology#7.5.0=tho
